name: Release

# Push a tag named exactly like the manifest version, e.g. `4.4.1`.
# Obsidian's official action then re-runs the community directory checks,
# builds from pnpm-lock.yaml, attests main.js and styles.css (the artifact
# attestations the directory review asks for) and creates a DRAFT release
# with main.js, manifest.json and styles.css. Publish it on the Releases page.
#
# Assets uploaded by hand can't be attested: release through this workflow.
on:
    push:
        tags: [ '*' ]

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            -   uses: actions/checkout@v7
            # pnpm-lock.yaml makes the action install with pnpm.
            -   uses: pnpm/action-setup@v6
                with:
                    version: 9
            -   uses: actions/setup-node@v7
                with:
                    node-version: 24
            -   uses: obsidianmd/obsidian-workflows@v1
                with:
                    mode: release
                    # Don't create a release that would fail the review.
                    strict: true
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
